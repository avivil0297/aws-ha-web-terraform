name: terraform-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: fmt / validate / shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.16"

      - name: terraform fmt
        run: terraform fmt -check -recursive

      - name: terraform init (no backend, no AWS credentials)
        run: terraform init -backend=false -input=false

      - name: terraform validate
        run: terraform validate

      - name: shellcheck scripts
        run: shellcheck -S error scripts/*.sh

  security-scan:
    name: Checkov security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          quiet: true
          # Report findings without failing the build; accepted trade-offs are documented in the README
          soft_fail: true
